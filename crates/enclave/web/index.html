<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>attest</title>
<link rel="alternate" type="text/markdown" href="/agents.md" title="Guide for agents">
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --sunken: #efede7; --ink: #1b1a17; --ink-2: #57544c; --ink-3: #8a867c;
  --line: #e2dfd6; --line-2: #d3cfc3; --accent: #2f4fd8; --accent-ink: #fff; --accent-soft: #e8ecfc;
  --ok: #1d7a4a; --ok-soft: #e3f3ea; --warn: #9a5b00; --warn-soft: #fbf0dc; --bad: #b3261e; --bad-soft: #fbe6e4;
  --shadow: 0 1px 2px rgba(27,26,23,.06), 0 4px 16px rgba(27,26,23,.05); --radius: 10px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --panel: #1c1c19; --sunken: #232320; --ink: #ecebe6; --ink-2: #b4b1a7; --ink-3: #85827a;
    --line: #2e2d29; --line-2: #3b3a35; --accent: #7d96ff; --accent-ink: #0e1330; --accent-soft: #232a48;
    --ok: #5fc48f; --ok-soft: #17301f; --warn: #e3a547; --warn-soft: #33270f; --bad: #f08a80; --bad-soft: #3a1c19;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 24px; } h2 { font-size: 16px; }
h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
p { margin: 0; }
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 10px 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 13px; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px 4px 10px; font-size: 13px; color: var(--ink-2); cursor: pointer; max-width: 100%; }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; display: inline-block; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.run { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 920px) { .grid { grid-template-columns: minmax(0, 1fr); } .wrap { padding: 14px 16px 40px; } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 18px 20px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 12.5px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.card-head .n { width: 24px; height: 24px; border-radius: 50%; background: var(--sunken); border: 1px solid var(--line-2); display: grid; place-items: center; font-weight: 600; font-size: 12px; color: var(--ink-2); flex: none; }
.card-head .n.done { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card-head h2 { flex: 1; }
.btn { text-decoration: none; color: var(--ink); border: 1px solid var(--line-2); background: var(--panel); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.big { padding: 11px 20px; font-size: 15px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.spin { width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 13px; min-width: 0; }
label.f .hint { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
table.prov { border-collapse: collapse; font-size: 13px; width: 100%; }
table.prov td { padding: 4px 8px 4px 0; vertical-align: top; border-top: 1px solid var(--line, #8883); }
input[type=text], input[type=password], input[type=number], input[type=email], select, textarea {
  width: 100%; border: 1px solid var(--line-2); background: var(--panel); border-radius: 8px; padding: 8px 10px; outline: none; }
::placeholder { color: var(--ink-3); opacity: .85; }
textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 13.5px; }
.check input { margin-top: 3px; accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 9px; padding: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line); background: var(--sunken); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; color: var(--ink-2); max-width: 100%; overflow-wrap: anywhere; }
.pill b { color: var(--ink); font-weight: 600; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.run { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.callout { border-radius: 9px; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.callout .ic { flex: none; font-weight: 700; width: 16px; text-align: center; }
.callout.info { background: var(--accent-soft); }
.callout.warn { background: var(--warn-soft); color: color-mix(in srgb, var(--warn) 70%, var(--ink)); }
.callout.bad { background: var(--bad-soft); color: color-mix(in srgb, var(--bad) 75%, var(--ink)); }
.callout.ok { background: var(--ok-soft); color: color-mix(in srgb, var(--ok) 70%, var(--ink)); }
.quote { margin: 0; padding: 12px 14px; border-left: 3px solid var(--ink); background: var(--sunken); border-radius: 0 8px 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.quote.serif { font-family: Georgia, "Iowan Old Style", serif; font-size: 14.5px; line-height: 1.6; }
.qtext { font-size: 16.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.banner { display: flex; gap: 12px; align-items: center; padding: 14px 18px; }
.banner .say { font-size: 15px; font-weight: 500; }
.linkbox { display: flex; gap: 8px; align-items: stretch; }
.linkbox input { font-family: var(--mono); font-size: 12px; }
.answer { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.answer.small { font-size: 26px; color: var(--ink-2); }
.meter { height: 6px; background: var(--sunken); border-radius: 999px; overflow: hidden; width: 150px; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
.summary { font-size: 15px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.flags { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.flags li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; background: var(--warn-soft); border-radius: 8px; font-size: 13.5px; overflow-wrap: anywhere; }
.flags li::before { content: "!"; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--warn); color: var(--panel); font-weight: 700; font-size: 12px; display: grid; place-items: center; margin-top: 1px; }
.run { border-top: 1px solid var(--line); }
.run:first-child { border-top: 0; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.hash { font-family: var(--mono); font-size: 12px; cursor: copy; border-bottom: 1px dotted var(--ink-3); }
.dpre { white-space: pre-wrap; word-break: break-word; font: 12px/1.45 var(--mono); background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 0; max-height: 360px; overflow: auto; }
.tx { display: flex; flex-direction: column; gap: 8px; max-height: 560px; overflow: auto; padding: 4px 2px; }
.ev { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 10px; }
.ev .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding-top: 3px; font-weight: 600; }
.ev .what { min-width: 0; }
.call { display: inline-flex; gap: 6px; align-items: baseline; background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; font-family: var(--mono); font-size: 12px; margin: 2px 6px 2px 0; max-width: 100%; overflow-wrap: anywhere; }
.call b { color: var(--accent); }
pre.out { margin: 6px 0 0; background: var(--sunken); border-radius: 8px; padding: 10px 12px; overflow: auto; max-height: 320px; font-size: 12px; line-height: 1.45; }
details > summary { cursor: pointer; color: var(--ink-2); }
.feed { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow: auto; }
.feed .e { font-size: 13px; display: grid; grid-template-columns: 54px 1fr; gap: 8px; }
.feed .e .t { color: var(--ink-3); font-size: 12px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 16px; text-align: center; color: var(--ink-2); cursor: pointer; }
.drop:hover { border-color: var(--accent); background: var(--accent-soft); }
.progress { height: 6px; background: var(--sunken); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 9px; z-index: 30; font-size: 13.5px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.toast.err { background: var(--bad); color: #fff; }
.hero { max-width: 760px; margin: 30px auto 0; display: flex; flex-direction: column; gap: 22px; }
.hero h1 { font-size: 34px; letter-spacing: -0.03em; line-height: 1.15; }
.hero .lead { font-size: 17px; line-height: 1.6; color: var(--ink-2); }
.steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 720px) { .steps3 { grid-template-columns: 1fr; } .hero h1 { font-size: 27px; } }
.steps3 .s { padding: 14px 16px; }
.steps3 .s b { display: block; margin-bottom: 4px; }
.foot { color: var(--ink-3); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 30px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="mark">a</span>attest</a>
  <span id="who"></span>
  <span class="spacer"></span>
  <button class="chip" id="encChip" data-act="show-verify"><i class="dot"></i><span class="t">…</span></button>
</header>
<main class="wrap" id="app"></main>
<div id="toastHost"></div>
<script>
"use strict";
// ---------------------------------------------------------------- utilities
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hash = (h, n = 12) => h ? `<span class="hash" data-copy="${esc(h)}" title="${esc(h)} (click to copy)">${esc(String(h).slice(0, n))}…</span>` : "—";
const bytes = (n) => { n = Number(n || 0); const u = ["B", "KB", "MB", "GB"]; let i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + u[i]; };
const num = (n) => Number(n || 0).toLocaleString();
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
function ago(ms) {
  if (!ms) return ""; const s = Math.round((Date.now() - ms) / 1000);
  if (s < 45) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
const clock = (ms) => new Date(ms).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
function toast(msg, err = false) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  $("#toastHost").replaceChildren(t); setTimeout(() => t.remove(), err ? 7000 : 2600);
}
async function busy(btn, fn) {
  if (!btn || btn.disabled) return fn();
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<i class="spin"></i>${html}`;
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; btn.innerHTML = html; }
}
// Set by `attest open`, the local client that checked the attestation and
// relays this page's API calls over TLS sessions ending inside the enclave.
const LOCAL = window.ATTEST_LOCAL || null;
const ORIGIN = LOCAL ? LOCAL.origin : location.origin;
const openCmd = () => `attest open '${ORIGIN}${location.pathname}${location.hash}'`;
const S = { sid: null, token: null, view: null, info: null, traces: {}, last: {}, polling: false };
async function api(path, { method = "GET", body, raw, timeout, extra } = {}) {
  const headers = { ...(extra || {}) };
  const ctl = new AbortController(); const timer = timeout ? setTimeout(() => ctl.abort(), timeout) : null;
  if (S.token) headers.authorization = "Bearer " + S.token;
  if (body !== undefined && !raw) headers["content-type"] = "application/json";
  let r;
  try { r = await fetch(path, { method, headers, signal: ctl.signal, body: raw ? body : body === undefined ? undefined : JSON.stringify(body) }); }
  finally { if (timer) clearTimeout(timer); }
  let j; try { j = await r.json(); } catch { j = { error: r.statusText || "unexpected response" }; }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const sapi = (p, opts) => api(`/api/sessions/${S.sid}${p}`, opts);
document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-copy]");
  if (c) { navigator.clipboard?.writeText(c.dataset.copy).then(() => toast("Copied")); }
});
/** Replace a container's HTML, keeping elements marked data-keep (live forms). */
function patch(id, html) {
  const el = document.getElementById(id); if (!el) return;
  if (S.last[id] === html) return; S.last[id] = html;
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  for (const k of $$("[data-keep]", tmp)) { const old = el.querySelector(`[data-keep="${k.dataset.keep}"]`); if (old) k.replaceWith(old); }
  el.replaceChildren(...tmp.childNodes);
}

// ---------------------------------------------------------------- enclave chip / verify
async function loadInfo() {
  try { S.info = await api("/api/info"); } catch { S.info = null; }
  const i = S.info, chip = $("#encChip");
  if (!i) { chip.innerHTML = `<i class="dot bad"></i><span class="t">Enclave unreachable</span>`; return; }
  const dev = i.mode === "dev";
  if (LOCAL && !dev) { chip.innerHTML = `<i class="dot ok"></i><span class="t">Checked by attest open · PCR0 ${esc((LOCAL.pcr0 || "").slice(0, 8))}</span>`; return; }
  if (!dev) { chip.hidden = true; return; }
  chip.innerHTML = `<i class="dot warn"></i><span class="t">Dev mode · not attested</span>`;
}
function verifyPanel() {
  const i = S.info; if (!i) return "";
  const host = new URL(ORIGIN).host, commit = i.source_commit || "";
  const install = "cargo install --git https://github.com/sophiawisdom/attest attest-cli";
  const check = `attest verify-service https://${host}`;
  const line = (cmd) => `<div class="linkbox"><input type="text" readonly value="${esc(cmd)}"><button class="btn" data-copy="${esc(cmd)}">Copy</button></div>`;
  const how = i.mode === "dev" ? `<div class="callout warn"><span class="ic">!</span><span>Dev mode: nothing is attested. For testing only.</span></div>`
    : LOCAL ? `<div class="callout info"><span class="ic">✓</span><span>Verified. You opened this through <code>attest open</code>, which checked the enclave against the measurements ${esc(LOCAL.measurements || "you gave it")}. Every request from this page goes over a connection it checked ends inside the enclave.</span></div>`
    : `<p class="small muted">This server runs in an AWS Nitro enclave: a sealed machine that can prove which software it runs. Nobody can see inside it, including whoever operates it. You can check that proof yourself:</p>
    <ol class="steps small">
      <li>Install the client (needs <a href="https://rustup.rs" target="_blank" rel="noopener">Rust</a>):${line(install)}</li>
      <li>Check the server. This confirms it runs exactly the published source at commit <code>${esc(commit.slice(0, 7))}</code>, and that connections to it end inside the enclave:${line(check)}</li>
      <li>Before connecting anything sensitive, open your session through the client. It checks the enclave first and then serves this page locally:${line(openCmd())}</li>
    </ol>
    <p class="small faint">Why not just trust this page? A browser checks the address, not the software behind it: whoever controls the address could serve a lookalike page.</p>`;
  return `<div class="panel pad stack" id="verify">
    <h3>Verify this service</h3>
    ${how}
    <dl class="kv">
      <dt>source</dt><dd><a href="${esc(i.source_repo)}/tree/${esc(commit)}" target="_blank" rel="noopener">${esc(commit.slice(0, 12))}</a></dd>
      <dt>measurements</dt><dd><a href="${esc(i.source_repo)}/blob/main/measurements/${esc(commit)}.pcrs.json" target="_blank" rel="noopener">published</a></dd>
      <dt>boot</dt><dd>${hash(i.boot_id, 8)} · ${esc(ago(i.booted_at_ms))}</dd>
      <dt>TLS key</dt><dd>${i.tls_spki_sha256 ? hash(i.tls_spki_sha256) : "—"}</dd>
      <dt>harness</dt><dd>${esc(i.harness.version)}</dd>
    </dl>
    <div class="small faint">Agents: <a href="/agents.md">/agents.md</a> explains the protocol and how to check the attestation yourself.</div>
  </div>`;
}

// ---------------------------------------------------------------- landing
function landing() {
  $("#who").innerHTML = "";
  $("#app").innerHTML = `<div class="hero">
    <h1>Prove it without showing it.</h1>
    <p class="lead">You want to prove something to someone without handing over your information. Give an AI agent access to all of it (code, Slack, email, bank accounts, any API) inside a sealed, verifiable machine. They ask it questions. Every answer comes to you first, and goes out only if you release it.</p>
    <p class="lead" style="font-size:15px">Nobody else sees your information: not the other party, and not whoever runs this server. Only the model provider you approve receives what the agent reads.</p>
    <div class="steps3">
      <div class="panel s"><b>1. Start a session</b><span class="muted small">Either side can start. Your session page shows a link to send the other party over a channel you already trust, such as Signal.</span></div>
      <div class="panel s"><b>2. Connect and ask</b><span class="muted small">The auditee connects what the agent may look at. The auditor asks a question; the auditee accepts it and approves the model.</span></div>
      <div class="panel s"><b>3. Release or decline</b><span class="muted small">The auditee reads each answer and everything the agent did first. Released answers come with a signed certificate; declined ones never leave.</span></div>
    </div>
    <div id="created">${S.info && S.info.open === false
      ? `<div class="stack"><p class="small muted">This server is private: only its operator starts sessions. Anyone the operator sends a session link to can take part.</p>
        <input type="password" id="opKey" placeholder="Operator key" autocomplete="off" style="max-width:320px">${startButtons()}</div>`
      : startButtons()}</div>
    ${S.info?.operator ? `<p class="small muted" id="notice">Operated by <b>${esc(S.info.operator)}</b>.</p>` : ""}
    <div class="foot"><a href="/agents.md">Guide for agents</a><a href="https://github.com/sophiawisdom/attest" target="_blank" rel="noopener">Source on GitHub</a><a href="#" data-act="show-verify">Verify this service</a></div>
    <div id="landingVerify"></div>
  </div>`;
}
function startButtons() {
  return `<div class="stack" style="gap:8px"><b>Start a session as</b>
    <div class="row"><button class="btn primary big" data-act="create" data-role="auditor">The auditor</button><button class="btn primary big" data-act="create" data-role="auditee">The auditee</button></div>
    <span class="faint small">The auditor asks the questions. The auditee connects the information and decides which answers go out.</span></div>`;
}
async function createSession(btn) {
  await busy(btn, async () => {
    const key = val("opKey").trim(), role = btn.dataset.role;
    const r = await api(`/api/sessions?role=${role}`, { method: "POST", body: {}, extra: key ? { "x-operator-key": key } : undefined });
    // Your own session page (same origin), which shows the other party's link.
    location.href = `/s/${r.session_id}#${role === "auditor" ? r.auditor_token : r.auditee_token}`;
  });
}

// The other party's token, derived from the creator's (sessions.rs invite_token).
async function inviteToken(token) {
  if (!crypto.subtle) return null;
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(token), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", k, new TextEncoder().encode("attest-invite/1"));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function renderInvite(v) {
  const box = document.getElementById("invite");
  box.hidden = !v.creator || v.creator !== v.role;
  if (box.hidden) return;
  S.invite ??= await inviteToken(S.token);
  const other = v.role === "auditee" ? "auditor" : "auditee";
  const joined = other === "auditor" && v.auditor_joined;
  if (!S.invite) return patch("invite", `<div class="pad small muted">This browser can't compute the ${other}'s link here; open the session over https or with <code>attest open</code>.</div>`);
  const link = `${ORIGIN}/s/${S.sid}#${S.invite}`;
  patch("invite", `<div class="pad stack" style="gap:8px">
    <div class="row"><b>Link for the ${other}</b>${joined ? `<span class="pill ok">opened</span>` : ""}</div>
    <span class="small muted">Send it to them over a channel you already trust, such as Signal. Anyone with this link acts as the ${other}. Keep your own link (this page's address) private.</span>
    <div class="linkbox"><input type="text" readonly value="${esc(link)}"><button class="btn" data-copy="${esc(link)}">Copy</button></div></div>`);
}

function renderQuestion(v) {

  else body += `<div class="stack" style="gap:8px"><div class="row">${statusPill(q.status)}<span class="faint small">version ${q.version} · ${esc(ago(q.asked_at_ms))} · step limit ${q.max_steps}${q.allow_fine_tuned ? " · fine-tuned models allowed" : ""}</span></div>

  if (isAuditee() && q?.status === "proposed") {
    body += `<div class="stack" data-keep="qdecide-${q.version}"><label class="f">Note to the auditor (optional)<input type="text" id="qNote" placeholder="e.g. please narrow this to the training service"></label>
      <div class="row"><button class="btn primary" data-act="q-accept" data-v="${q.version}">Accept question</button><button class="btn danger" data-act="q-reject" data-v="${q.version}">Reject</button></div></div>`;
  }
  if (!isAuditee()) {
    const canAsk = !q || q.status !== "proposed";
    const clar = v.runs.find(r => r.verdict?.answer === "needs_clarification" && r.status === "released");
    if (canAsk || q?.status === "proposed") {
      const open = !q || q.status === "rejected" || !!clar;
      body += `<details data-keep="qform" ${open ? "open" : ""}><summary>${q ? "Revise the question" : "Your question"}</summary>
        <div class="stack" style="margin-top:10px">
          ${clar ? `<div class="callout info"><span class="ic">?</span><span>The agent asked for clarification: ${esc(clar.verdict.clarification_request)}</span></div>` : ""}

          <label class="f">What you can receive back

            <select id="qFormat">
              <option value="text" ${(q?.answer_format?.kind || "text") === "text" ? "selected" : ""}>A verdict and a short explanation</option>
              <option value="yes_no" ${q?.answer_format?.kind === "yes_no" ? "selected" : ""}>Yes / no only</option>
              <option value="choice" ${q?.answer_format?.kind === "choice" ? "selected" : ""}>One of my options</option>
            </select></label>

            <label class="f" data-for="text">Explanation limit (bytes)<input type="number" id="qBytes" min="1" max="20000" value="${q?.answer_format?.max_bytes || 4000}"></label>
            <label class="f" data-for="choice">Options, one per line<textarea id="qOptions" style="min-height:70px">${esc((q?.answer_format?.options || []).join("\n"))}</textarea></label>
          </div>
          <div class="grid2"><label class="f">Step limit<input type="number" id="qSteps" min="1" max="400" value="${q?.max_steps || 150}"></label>
          <div class="f" style="justify-content:flex-end"><label class="check"><input type="checkbox" id="qFt" ${q?.allow_fine_tuned ? "checked" : ""}><span>Allow fine-tuned models<br><span class="faint small">A private fine-tune is the cheapest way to get a model that answers one question wrongly.</span></span></label></div></div>

}

// ---------------------------------------------------------------- runs
function formatLabel(f) {
  if (!f || f.kind === "text") return `verdict + up to ${num(f?.max_bytes || 4000)} bytes of explanation`;
  if (f.kind === "yes_no") return "yes / no only";

}
function verdictHtml(r) {

function facts(m) {

function traceHtml(entries) {
  const out = [];
  for (const e of entries) {
    if (e.type === "system") out.push(`<div class="ev"><div class="who">Harness</div><div class="what"><details><summary class="small">Fixed system prompt</summary><pre class="out">${esc(e.content)}</pre></details></div></div>`);
    else if (e.type === "user") out.push(`<div class="ev"><div class="who">Task</div><div class="what small muted" style="white-space:pre-wrap">${esc(e.content)}</div></div>`);
    else if (e.type === "auditor_message") out.push(`<div class="ev"><div class="who">Auditor</div><div class="what">${e.blinded ? `<span class="pill warn">blinded message: hidden from you</span>` : `<p style="white-space:pre-wrap">${esc(e.content)}</p>`}</div></div>`);
    else if (e.type === "assistant") {
      const calls = (e.tool_calls || []).map(c => {
        const a = c.args || {}; const main = c.name === "submit_verdict" ? a.answer : (a.path ?? a.pattern ?? "");
        return `<span class="call"><b>${esc(c.name)}</b> ${esc(main === "" ? "(root)" : main)}</span>`;
      }).join("");
      out.push(`<div class="ev"><div class="who">Agent</div><div class="what">${e.text ? `<p style="white-space:pre-wrap;margin-bottom:4px">${esc(e.text)}</p>` : ""}${calls}</div></div>`);
    } else if (e.type === "tool_result" && e.name !== "submit_verdict") {
      const c = String(e.content || ""); const n = c.split("\n").length;

    } else if (e.type === "harness_log") out.push(`<div class="ev"><div class="who">Agent log</div><div class="what"><pre class="out" style="margin:0">${esc(e.content)}</pre></div></div>`);
    else if (e.type === "approval") out.push(`<div class="ev"><div class="who">You</div><div class="what small">${e.approved ? `<span class="pill ok">approved</span>` : `<span class="pill warn">denied</span>`} <b>${esc(e.tool)}</b>${e.reason ? ` <span class="faint">${esc(e.reason)}</span>` : ""}</div></div>`);
    else if (e.type === "harness") out.push(`<div class="ev"><div class="who">Harness</div><div class="what faint small">${esc(e.content)}</div></div>`);
    else if (e.type === "error") out.push(`<div class="ev"><div class="who">Error</div><div class="what"><div class="callout bad"><span>${esc(e.content)}</span></div></div></div>`);
    else if (e.type === "files_read") out.push(`<div class="ev"><div class="who">Read</div><div class="what"><div class="pills">${(e.paths || []).map(p => `<span class="pill mono">${esc(p)}</span>`).join("") || `<span class="faint small">no files</span>`}</div></div></div>`);

}

  const items = pend.map(c => `<div class="panel pad stack" style="gap:6px;border-color:var(--warn,#c80)"><div class="row" style="gap:8px"><b>${esc(c.tool)}</b><span class="pill">run ${c.run_number}</span><span class="pill">${esc(c.agent)}</span><span class="faint small">waiting ${esc(ago(c.asked_at_ms))}</span></div>

function renderRuns(v) {

function runHtml(v, r) {

      <label class="f">Note to the auditor (optional)<input type="text" id="note-${r.id}"></label>
      <div class="row"><button class="btn primary" data-act="release" data-run="${r.id}">Release to auditor</button><button class="btn danger" data-act="decline" data-run="${r.id}">Decline</button></div></div>`;
    if (r.status === "released" || r.status === "declined") main += `<p class="small faint">You ${r.status} this ${esc(ago(r.decided_at_ms))}${r.decision_note ? `: “${esc(r.decision_note)}”` : ""}.</p>`;
    main += `<details ${r.status === "running" ? "open" : ""} data-keep="txd-${r.id}"><summary>Transcript (only you can see this)</summary><div class="tx" id="tx-${r.id}"></div></details>`;
  } else {
    if (r.status === "running") main += `<div class="row"><i class="spin" style="color:var(--accent)"></i><span class="muted">The agent is working. You can't see its progress; you'll see the result if the auditee releases it.</span></div>`;
    else if (r.status === "awaiting_release") main += `<p class="muted">The agent finished. Waiting for the auditee to release or decline the result.</p>`;
    else if (r.status === "declined") main += `<div class="callout bad"><span class="ic">×</span><span>The auditee declined to release this result${r.decision_note ? `: “${esc(r.decision_note)}”` : "."}</span></div>`;
    else if (r.status === "released") main += verdictHtml(r) + (r.flags?.length ? `<div class="stack" style="gap:6px"><h3>Weigh these</h3><ul class="flags">${r.flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : "") + facts(r.manifest)
      + `${r.decision_note ? `<p class="small faint">Auditee's note: “${esc(r.decision_note)}”</p>` : ""}<div class="row"><a class="btn" href="#" data-act="cert" data-run="${r.id}">Download certificate</a><span class="faint small">Signed by the enclave; check it with <code>attest verify</code>.</span></div>`;
    const busyNow = v.runs.some(x => x.status === "running");
    if ((r.status === "released" || r.status === "declined") && !busyNow && r === [...v.runs].reverse().find(x => x.status === "released" || x.status === "declined"))
      main += `<details data-keep="fu-${r.id}"><summary>Send the agent a follow-up</summary><div class="stack" style="margin-top:10px">
        <textarea id="fu-${r.id}" placeholder="What did you check to rule out the RL pipeline?"></textarea>

        <div class="row"><button class="btn primary" data-act="followup" data-run="${r.id}">Send follow-up</button></div></div></details>`;
  }
  return `<div class="run pad stack">${meta}${msgHtml}${main}</div>`;
}

// ---------------------------------------------------------------- disclosures
function disclosureContent(c) {

    <pre class="dpre">${esc(c.stdout || "(no output)")}</pre>${c.stderr ? `<details><summary class="small">stderr</summary><pre class="dpre">${esc(c.stderr)}</pre></details>` : ""}`;
}

    if (!v.code) body += `<p class="muted">Upload code first.</p>`;
    else body += `<details data-keep="disc-new"><summary>New disclosure</summary><div class="stack" style="margin-top:10px">
      <label class="f">Kind<select id="dKind"><option value="file">A file</option><option value="python">A script's output</option></select></label>
      <label class="f" data-dfor="file">Path<input type="text" id="dPath" placeholder="trainer/train.py"></label>
      <label class="f" data-dfor="python" hidden>Python (the code is read-only at /repo; no network; 60 s)<textarea id="dCode" placeholder="import os&#10;print(sum(1 for _ in os.walk('/repo')))"></textarea></label>
      <label class="f">Note for the auditor (optional)<input type="text" id="dNote"></label>
      <div class="row"><button class="btn primary" data-act="disc-draft">Prepare draft</button></div></div></details>`;
  } else if (!ds.length) {
    body += `<p class="muted">Nothing disclosed. The auditee can choose to show you files, or the output of scripts run over the code, each signed by the enclave.</p>`;
  }
  body += ds.slice().reverse().map(d => `<div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:10px">
    <div class="row"><b>${d.status === "published" ? "#" + d.number : "draft " + d.draft}</b> ${statusPill(d.status)}<span class="faint small">${esc(ago(d.body.published_at_ms || d.body.created_at_ms))}</span></div>
    ${d.body.note ? `<p class="small">${esc(d.body.note)}</p>` : ""}${disclosureContent(d.body.content)}
    ${d.status === "draft" ? `<div class="row"><button class="btn primary" data-act="disc-publish" data-n="${d.draft}">Publish to auditor</button><button class="btn danger" data-act="disc-discard" data-n="${d.draft}">Discard</button></div>`
      : `<div class="row"><a class="btn" href="#" data-act="disc-get" data-n="${d.number}">Download signed disclosure</a><span class="faint small">Check it with <code>attest verify</code>.</span></div>`}</div>`).join("");
  patch("cDisclose", `<div class="card-head"><h2>Disclosures</h2></div><div class="pad stack">${body}</div>`);
}

// ---------------------------------------------------------------- side
function renderActivity(v) {
  S.events = (S.events || []).concat(v.events.filter(e => !(S.events || []).some(x => x.seq === e.seq)));
  const evs = [...S.events].reverse();
  patch("cActivity", `<h3>Activity</h3><div class="feed">${evs.length ? evs.map(e => `<div class="e"><span class="t">${esc(clock(e.at_ms))}</span><span>${esc(e.text)}</span></div>`).join("") : `<span class="faint small">Nothing yet.</span>`}</div>`);
}
function renderNotify(v) {
  const n = v.notify || {};
  const st = {
    checking: ["", "Checking…"],
    pending: ["warn", "Check your inbox for a confirmation email from Amazon Web Services and click its link. Nothing else is sent until you do."],
    verified: ["ok", "Confirmed. You'll get an email when it's your turn."],
    rate_limited: ["bad", "Too many new addresses on this server right now; try again in an hour."],
    error: ["bad", "Couldn't set up email for this address."],
  }[n.email_status];
  patch("cNotify", `<h3>Email me</h3>
    ${v.email_available ? `<div class="stack" data-keep="notify-${esc(n.email || "")}">
      <p class="small muted">Runs can take a while. Get an email when it's your turn.</p>
      <div class="linkbox"><input type="email" id="nEmail" value="${esc(n.email || "")}" placeholder="you@example.com"><button class="btn" data-act="notify">Save</button></div></div>
      ${n.email && st ? `<div class="callout ${st[0] || "info"} small"><span>${esc(st[1])}</span></div>` : ""}`
    : `<p class="small faint">Email isn't set up on this server.</p>`}
    <p class="small faint">Agents: poll <code>GET /api/sessions/ID?version=N&amp;wait=25</code> (<a href="/agents.md">guide</a>).</p>`);
}

// ---------------------------------------------------------------- actions
const val = (id) => document.getElementById(id)?.value ?? "";
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "create") return createSession(b);
  if (act === "show-verify") {
    e.preventDefault();
    if (!S.sid) { await loadInfo(); $("#landingVerify").innerHTML = verifyPanel(); return; }
    document.getElementById("verify")?.scrollIntoView({ behavior: "smooth" }); return;
  }
  if (act === "mcp-preview") { await busy(b, mcpPreview); return; }
  if (act === "tool-tab") {
    S.toolTab = b.dataset.k;
    $$("#toolTabs button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $$("[data-pane]").forEach(p => p.hidden = p.dataset.pane !== b.dataset.k);
    return;
  }
  if (act === "prov") {
    $$("#mProv button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    const p = [...PROVIDERS, { id: "mock", ph: "gpt-mock" }].find(x => x.id === b.dataset.p);
    $("#mModel").placeholder = p.ph; $("#mZdrRow").hidden = p.id !== "openrouter"; $("#mOnlyRow").hidden = p.id !== "openrouter"; $("#mMockRow").hidden = p.id !== "mock"; showCloud("m", p.id); return;
  }
  if (act === "cert") {
    e.preventDefault();
    return busy(b, async () => {
      const c = await sapi(`/runs/${b.dataset.run}/certificate`);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(c, null, 2)], { type: "application/json" }));
      a.download = `certificate-${b.dataset.run.slice(0, 8)}.json`; a.click(); URL.revokeObjectURL(a.href);
    });
  }
  if (act === "disc-get") {
    e.preventDefault();
    return busy(b, async () => {
      const d = await sapi(`/disclosures/${b.dataset.n}`);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: "application/json" }));
      a.download = `disclosure-${S.sid.slice(0, 8)}-${b.dataset.n}.json`; a.click(); URL.revokeObjectURL(a.href);
    });
  }
  const actions = {
    "disc-draft": () => sapi("/disclosures", { method: "POST", body: val("dKind") === "python" ? { kind: "python", code: val("dCode"), note: val("dNote") } : { kind: "file", path: val("dPath"), note: val("dNote") } }),
    "disc-publish": () => sapi(`/disclosures/${b.dataset.n}/decision`, { method: "POST", body: { publish: true } }),
    "disc-discard": () => sapi(`/disclosures/${b.dataset.n}/decision`, { method: "POST", body: { publish: false } }),
    "ask": () => {
      const kind = val("qFormat") || "text";
      const answer_format = kind === "yes_no" ? { kind } : kind === "choice"
        ? { kind, options: val("qOptions").split("\n").map(s => s.trim()).filter(Boolean) }
        : { kind: "text", max_bytes: Number(val("qBytes") || 4000) };
      return sapi("/question", { method: "POST", body: { text: val("qText"), max_steps: Number(val("qSteps") || 150), allow_fine_tuned: $("#qFt")?.checked, answer_format } });
    },
    "q-accept": () => sapi("/question/decision", { method: "POST", body: { version: Number(b.dataset.v), accept: true, note: val("qNote") } }),
    "q-reject": () => sapi("/question/decision", { method: "POST", body: { version: Number(b.dataset.v), accept: false, note: val("qNote") } }),
    "github": () => sapi("/code/github", { method: "POST", timeout: 15 * 60 * 1000, body: { repo: val("ghRepo").trim(), ref: val("ghRef").trim() || undefined, token: val("ghToken").trim() } }),
    "connect": () => {
      const k = b.dataset.kind, body = { kind: k };
      for (const el of $$(`[data-pane="${k}"] [id^="t_${k}_"]`)) {
        const f = el.id.slice(`t_${k}_`.length), x = el.value.trim();
        if (x) body[f === "desc" ? "description" : f] = x;
      }
      if (k === "http") body.methods = $$(".t_http_m").filter(x => x.checked).map(x => x.value);
      if (k === "mcp") body.tools = $$(".t_mcp_tool").filter(x => x.checked).map(x => x.value);
      return sapi("/connections", { method: "POST", timeout: 60000, body });
    },
    "tool-approval": () => sapi("/tool-approval", { method: "POST", body: { enabled: !!b.dataset.on } }),
    "tc-decide": () => sapi(`/tool-calls/${b.dataset.id}`, { method: "POST", body: { approve: !!b.dataset.ok, reason: val("tcr-" + b.dataset.id) } }),
    "disconnect": () => sapi(`/connections/${b.dataset.id}`, { method: "DELETE" }),
    "propose-model": () => sapi("/models", { method: "POST", body: { provider: $("#mProv [aria-pressed=true]").dataset.p, model: val("mModel"), api_key: val("mKey"), openrouter_zdr: $("#mZdr")?.checked, openrouter_only: (val("mOnly") || "").split(",").map(s => s.trim()).filter(Boolean), mock_endpoint: val("mMock"), agent: val("mAgent") || "builtin", ...cloudValues("m") } }),
    "m-approve": () => sapi(`/models/${b.dataset.id}/decision`, { method: "POST", body: { approve: true, api_key: val("ak-" + b.dataset.id) || undefined, accept_auditor_account: $("#acc-" + b.dataset.id)?.checked || false, ...cloudValues("a" + b.dataset.id) } }),
    "m-reject": () => sapi(`/models/${b.dataset.id}/decision`, { method: "POST", body: { approve: false } }),
    "release": () => sapi(`/runs/${b.dataset.run}/release`, { method: "POST", body: { release: true, details: !!$("#det-" + b.dataset.run)?.checked, note: val("note-" + b.dataset.run) } }),
    "decline": () => sapi(`/runs/${b.dataset.run}/release`, { method: "POST", body: { release: false, note: val("note-" + b.dataset.run) } }),
    "followup": () => sapi(`/runs/${b.dataset.run}/followup`, { method: "POST", body: { text: val("fu-" + b.dataset.run), blinded: $("#fub-" + b.dataset.run)?.checked } }),
    "notify": () => sapi("/notify", { method: "POST", body: { email: val("nEmail") } }),
  };
  if (!actions[act]) return;
  await busy(b, async () => {
    await actions[act]();
    // A submitted form is done: let it re-render fresh.
    b.closest("[data-keep]")?.removeAttribute("data-keep");
    if (act === "propose-model" && $("#mKey")) $("#mKey").value = "";
    toast("Done"); await refresh();
  });
});
async function mcpPreview() {
  const box = $("#mcpTools");
  box.innerHTML = `<span class="small muted">Asking the server…</span>`;
  try {
    const p = await sapi("/connections/preview", { method: "POST", timeout: 60000, body: { kind: "mcp", url: val("t_mcp_url").trim(), token: val("t_mcp_token").trim() } });
    box.innerHTML = `<span class="small"><b>${esc(p.server)}</b> has ${p.tools.length} tool(s). Choose what the agent may call:</span>` +
      p.tools.map(t => `<label class="check"><input type="checkbox" class="t_mcp_tool" value="${esc(t.name)}" ${t.read_only ? "checked" : ""}><span><code>${esc(t.name)}</code> ${t.read_only ? `<span class="pill">read-only</span>` : `<span class="pill warn">may change things</span>`} <span class="faint small">${esc(t.description.slice(0, 200))}</span></span></label>`).join("");
  } catch (e) { box.innerHTML = ""; throw e; }
}
function syncFormatFields() {
  const k = val("qFormat") || "text";
  $$("#qFormatExtra [data-for]").forEach(el => el.hidden = el.dataset.for !== k);
}
document.addEventListener("change", (e) => {
  if (e.target.id === "qFormat") syncFormatFields();
  if (e.target.id === "dKind") $$("[data-dfor]").forEach(el => el.hidden = el.dataset.dfor !== e.target.value);
});
new MutationObserver(() => { if ($("#qFormat")) syncFormatFields(); }).observe(document.documentElement, { childList: true, subtree: true });
document.addEventListener("change", async (e) => {
  if (e.target.id !== "folder") return;
  const all = [...e.target.files].filter(f => !f.webkitRelativePath.split("/").includes(".git"));
  const files = all;
  if (!files.length) return toast("That folder is empty.", true);
  const total = files.reduce((n, f) => n + f.size, 0);
  const st = $("#upStatus");
  st.innerHTML = `<div class="stack"><div class="small">${num(files.length)} files, ${bytes(total)}. Uploading…</div><div class="progress"><i id="upBar"></i></div></div>`;
  try {
    const tar = makeTar(files);
    await new Promise((res, rej) => {
      const x = new XMLHttpRequest();
      x.open("PUT", `/api/sessions/${S.sid}/code`); x.setRequestHeader("authorization", "Bearer " + S.token);
      x.upload.onprogress = (p) => { if (p.lengthComputable) $("#upBar").style.width = (100 * p.loaded / p.total) + "%"; };
      x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch {} x.status === 200 ? res(j) : rej(new Error(j.error || x.statusText)); };
      x.onerror = () => rej(new Error("upload failed"));
      x.send(tar);
    });
    st.closest("[data-keep]")?.removeAttribute("data-keep");
    toast("Uploaded"); await refresh();
  } catch (err) { st.innerHTML = `<div class="callout bad"><span class="ic">×</span><span>${esc(err.message)}</span></div>`; }
});

/** Minimal tar (ustar + PAX for long paths) from browser File objects. */
function makeTar(files) {
  const enc = new TextEncoder(), parts = [];
  const header = (name, size, type = "0") => {
    const h = new Uint8Array(512);
    const put = (s, off, len) => h.set(enc.encode(s).slice(0, len), off);
    const oct = (n, len) => (n.toString(8).padStart(len - 1, "0") + "\0");
    put(name, 0, 100); put("0000644\0", 100, 8); put(oct(0, 8), 108, 8); put(oct(0, 8), 116, 8);
    put(oct(size, 12), 124, 12); put(oct(0, 12), 136, 12); put("        ", 148, 8); put(type, 156, 1);
    put("ustar\0", 257, 6); put("00", 263, 2);
    let sum = 0; for (const b of h) sum += b; put(sum.toString(8).padStart(6, "0") + "\0 ", 148, 8);
    return h;
  };
  const pad = (n) => n % 512 ? new Uint8Array(512 - n % 512) : null;
  for (const f of files) {
    const path = f.webkitRelativePath.split("/").slice(1).join("/") || f.name;
    if (enc.encode(path).length > 99) {
      let rec = ` path=${path}\n`, len = enc.encode(rec).length;
      let full = `${len + String(len).length} ${rec.slice(1)}`;
      while (enc.encode(full).length !== Number(full.split(" ")[0])) { len = enc.encode(full).length; full = `${len}${rec}`; }
      const data = enc.encode(full);
      parts.push(header("PaxHeader", data.length, "x"), data); const p = pad(data.length); if (p) parts.push(p);
    }
    parts.push(header(path.slice(0, 99), f.size), f); const p = pad(f.size); if (p) parts.push(p);
  }
  parts.push(new Uint8Array(1024));
  return new Blob(parts);
}

// ---------------------------------------------------------------- polling
async function refresh(wait = false) {
  const q = wait && S.view ? `?version=${S.view.version}&wait=25` : "";
  const view = await sapi(q, { timeout: 35000 });
  if (!S.view || view.version >= S.view.version) S.view = view;
  for (const r of S.view.runs) {
    if (!isAuditee()) continue;
    const t = S.traces[r.id] || (S.traces[r.id] = { entries: [], next: 0, done: false });
    if (t.done) continue;
    // Pages of up to a few MiB; keep fetching while there's more.
    for (let page = 0; page < 20; page++) {
      const res = await sapi(`/runs/${r.id}/trace?after=${t.next}`);
      // Idempotent even if two refreshes overlap: place entries by position.
      const start = res.next - res.entries.length;
      t.entries = t.entries.slice(0, start).concat(res.entries); t.next = res.next;
      t.done = res.status !== "running" && !res.more;
      if (!res.more) break;
    }
  }
  render();
}
async function pollLoop() {
  if (S.polling) return; S.polling = true;
  for (;;) {
    try { await refresh(true); } catch (e) { await new Promise(r => setTimeout(r, 5000)); }
  }
}

// ---------------------------------------------------------------- boot
(async function boot() {
  await loadInfo();
  const m = location.pathname.match(/^\/s\/([0-9a-f]+)$/);
  if (!m) return landing();
  S.sid = m[1]; S.token = location.hash.slice(1);
  if (!S.token) { $("#app").innerHTML = `<div class="callout bad"><span class="ic">×</span><span>This link is missing its secret part (after the #). Ask for the full link.</span></div>`; return; }
  sessionShell();
  try { await refresh(); } catch (e) { $("#app").innerHTML = `<div class="callout bad"><span class="ic">×</span><span>${esc(e.message)}. If the enclave restarted, sessions were lost and you need a new one.</span></div>`; return; }
  pollLoop();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh().catch(() => {}); });
})();
