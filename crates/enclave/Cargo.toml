[package]
name = "attest-enclave"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
attest-core = { path = "../core" }
anyhow.workspace = true
base64.workspace = true
ring = "0.17"
bytes.workspace = true
clap.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rand.workspace = true
regex.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-rustls.workspace = true
webpki-roots = "1"
ed25519-dalek = "2"
url = "2"
http = "1"
hmac = "0.12"
chacha20poly1305 = "0.10"
lz4_flex = "0.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
wasmtime = { version = "46", default-features = false, features = ["cranelift", "async", "runtime", "std", "parallel-compilation"] }
wasi-common = { version = "46", default-features = false, features = ["tokio", "wasmtime", "trace_log"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring"] }
x509-parser = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = "0.5"
tokio-vsock.workspace = true
vsock = "0.5"
aws-nitro-enclaves-nsm-api = "0.5"
serde_bytes = "0.11"
